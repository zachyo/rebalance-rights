<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title description">
  <title id="title">Rebalance Rights video thumbnail</title>
  <desc id="description">Bold editorial graphic showing token allocation moving from a pool into rebalance rights.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#101010" stroke-width="1" opacity=".16"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="10" dy="10" stdDeviation="0" flood-color="#101010"/>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="#ff593d"/>
  <rect width="1280" height="720" fill="url(#grid)"/>
  <rect x="0" y="0" width="1280" height="38" fill="#101010"/>
  <text x="46" y="26" fill="#dcff36" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="900" letter-spacing="3">ON-CHAIN LIQUIDITY INFRASTRUCTURE</text>
  <text x="1133" y="26" fill="#f5eeda" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="900" letter-spacing="2">DEMO</text>

  <g transform="translate(55 101)">
    <rect width="618" height="71" fill="#f5eeda" stroke="#101010" stroke-width="4"/>
    <text x="20" y="25" fill="#101010" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="900" letter-spacing="2">LIQUIDITY REBALANCING, WITHOUT TRUST</text>
    <text x="20" y="53" fill="#1746db" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="900" letter-spacing="1">AUCTION THE RIGHT. EXECUTE THE MOVE.</text>
  </g>

  <text x="52" y="295" fill="#101010" font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="128" font-weight="900" letter-spacing="-10">REBALANCE</text>
  <text x="52" y="414" fill="#f5eeda" stroke="#101010" stroke-width="3" paint-order="stroke" font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="128" font-weight="900" letter-spacing="-10">RIGHTS</text>
  <path d="M57 451H649" stroke="#101010" stroke-width="5"/>
  <text x="57" y="490" fill="#101010" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="900">TURN LP IMBALANCE INTO A COMPETITIVE MARKET</text>

  <g filter="url(#shadow)" transform="translate(759 98) rotate(3 225 260)">
    <rect width="430" height="514" fill="#1746db" stroke="#101010" stroke-width="5"/>
    <text x="30" y="51" fill="#dcff36" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="900" letter-spacing="2">POOL STATUS</text>
    <line x1="30" x2="400" y1="73" y2="73" stroke="#f5eeda" stroke-width="3"/>
    <text x="30" y="132" fill="#f5eeda" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="900">CURRENT ALLOCATION</text>
    <rect x="30" y="155" width="370" height="63" fill="#101010"/>
    <rect x="30" y="155" width="237" height="63" fill="#dcff36"/>
    <text x="48" y="195" fill="#101010" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="900">60 DLP</text>
    <text x="282" y="195" fill="#f5eeda" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="900">40 DLP</text>
    <text x="30" y="270" fill="#f5eeda" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="900">REBALANCE WINDOW</text>
    <rect x="30" y="292" width="370" height="76" fill="#ff593d" stroke="#101010" stroke-width="4"/>
    <text x="49" y="343" fill="#101010" font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="40" font-weight="900">LIVE AUCTION</text>
    <rect x="30" y="397" width="176" height="77" fill="#f5eeda" stroke="#101010" stroke-width="4"/>
    <text x="46" y="428" fill="#101010" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="900">BEST BID</text>
    <text x="46" y="460" fill="#1746db" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="900">1.5 DLP</text>
    <rect x="224" y="397" width="176" height="77" fill="#dcff36" stroke="#101010" stroke-width="4"/>
    <text x="240" y="428" fill="#101010" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="900">EXECUTION</text>
    <text x="240" y="460" fill="#101010" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="900">READY</text>
  </g>

  <g transform="translate(547 516) rotate(-7)">
    <rect width="183" height="112" fill="#dcff36" stroke="#101010" stroke-width="5"/>
    <text x="16" y="35" fill="#101010" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="900" letter-spacing="1">REACTIVE</text>
    <text x="16" y="81" fill="#101010" font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="49" font-weight="900">RSC</text>
  </g>
  <path d="M688 575 C728 566, 754 545, 786 501" fill="none" stroke="#101010" stroke-width="9"/>
  <path d="M778 513 L787 493 L765 497" fill="none" stroke="#101010" stroke-width="9" stroke-linejoin="miter"/>

  <rect x="0" y="675" width="1280" height="45" fill="#101010"/>
  <text x="53" y="704" fill="#f5eeda" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="900" letter-spacing="1">UNISWAP V4  /  REACTIVE NETWORK  /  CROSS-CHAIN AUTOMATION</text>
